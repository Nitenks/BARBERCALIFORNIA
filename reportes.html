<!doctype html>
<html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reportes California Barber</title><style>body{background:#0a0b0d;color:#fff;font-family:Arial;padding:20px}.card{background:#15171b;border:1px solid #292e36;border-radius:18px;padding:18px;margin-bottom:15px}.title{font-size:28px;font-weight:900}.input,select,button{width:100%;height:48px;margin-top:10px;border-radius:12px;border:1px solid #333;background:#1b1e23;color:white;padding:0 12px}button{background:#e0b85b;color:#111;font-weight:900}.grid,.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi{background:#101216;padding:14px;border-radius:14px}.v{font-size:22px;font-weight:900}.gold{color:#f2d27d}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #292e36}@media(max-width:600px){.grid,.kpis{grid-template-columns:1fr}}</style></head>
<body><div class="title">📄 Reportes por Barbero</div><p>Cierre y análisis para pago de comisiones</p><div class="card"><select id="barber"><option>Cargando...</option></select><div class="grid"><input id="from" class="input" type="date"><input id="to" class="input" type="date"></div><button onclick="generar()">Generar reporte</button></div><div id="resultado"></div>
<script>
const URL='https://wzrakdrgsknargtjxwlj.supabase.co';const KEY='sb_publishable_JzLpixHslq1OGpDa52xlbQ_kawfbn5p';const session=JSON.parse(sessionStorage.getItem('cb_session')||'{}');const token=session.access_token;const money=n=>'$'+Number(n||0).toLocaleString('es-CL');let barbers=[];
async function api(path){let r=await fetch(URL+'/rest/v1/'+path,{headers:{apikey:KEY,Authorization:'Bearer '+token}});let j=await r.json();if(!Array.isArray(j))console.log(j);return j}
async function init(){barbers=await api('barbers?select=id,name,branch_id&order=name');document.getElementById('barber').innerHTML=barbers.map(b=>`<option value="${b.id}">${b.name}</option>`).join('')}
async function generar(){let id=document.getElementById('barber').value;if(!id)return;let from=document.getElementById('from').value,to=document.getElementById('to').value;let filters=(from?'&business_date=gte.'+from:'')+(to?'&business_date=lte.'+to:'');let cuts=await api('cuts?select=*&barber_id=eq.'+id+filters);let products=await api('products?select=*&barber_id=eq.'+id+filters);if(!Array.isArray(cuts)||!Array.isArray(products))return;let all=[...cuts,...products];let total=all.reduce((a,x)=>a+Number(x.price||0),0);let cash=all.filter(x=>x.payment_method==='cash').reduce((a,x)=>a+Number(x.price||0),0);let debit=all.filter(x=>x.payment_method==='debit').reduce((a,x)=>a+Number(x.price||0),0);let transfer=all.filter(x=>x.payment_method==='transfer').reduce((a,x)=>a+Number(x.price||0),0);let comm=cuts.reduce((a,x)=>a+Number(x.price||0)*.5,0)+products.filter(x=>Number(x.price)>=7000).reduce((a,x)=>a+Number(x.price||0)*.1,0);let b=barbers.find(x=>x.id===id);document.getElementById('resultado').innerHTML=all.length?`<div class="card"><h2>${b?.name}</h2><div class="kpis"><div class="kpi">Cortes<div class="v">${cuts.length}</div></div><div class="kpi">Venta<div class="v gold">${money(total)}</div></div><div class="kpi">Productos<div class="v">${products.length}</div></div><div class="kpi">Comisión<div class="v">${money(comm)}</div></div></div><h3>Medios de pago</h3><div class="row">💵 Efectivo <b>${money(cash)}</b></div><div class="row">💳 Tarjeta <b>${money(debit)}</b></div><div class="row">📲 Transferencia <b>${money(transfer)}</b></div></div>`:`<div class="card">No hay movimientos para este barbero en este periodo.</div>`}
init();
</script></body></html>
