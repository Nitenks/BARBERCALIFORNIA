<!doctype html>
<html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reportes California Barber</title><style>body{background:#090b0e;color:#fff;font-family:Arial;padding:20px}.card{background:#15181d;border-radius:18px;padding:18px;margin-bottom:15px;border:1px solid #292d35}.title{font-size:28px;font-weight:900}.grid,.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:#101216;border-radius:14px;padding:15px}.num{font-size:24px;font-weight:900;color:#e5c16b}select,input,button{width:100%;height:48px;border-radius:12px;margin:5px 0;background:#1c2026;color:white;border:1px solid #333;padding:0 12px}button{background:#e5c16b;color:#111;font-weight:bold}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #333}@media(max-width:600px){.grid,.kpis{grid-template-columns:1fr}}</style></head><body><div class="title">📄 Reportes por Barbero</div><p>Cierre completo para pagos y análisis</p><div class="card"><select id="barber"></select><div class="grid"><input id="from" type="date"><input id="to" type="date"></div><button onclick="generar()">Generar reporte</button></div><div id="resultado"></div><script>
const URL='https://wzrakdrgsknargtjxwlj.supabase.co',KEY='sb_publishable_JzLpixHslq1OGpDa52xlbQ_kawfbn5p';const token=JSON.parse(sessionStorage.getItem('cb_session')||'{}').access_token;let barbers=[];const money=n=>'$'+Number(n||0).toLocaleString('es-CL');async function api(p){let r=await fetch(URL+'/rest/v1/'+p,{headers:{apikey:KEY,Authorization:'Bearer '+token}});return r.json()}async function init(){barbers=await api('barbers?select=id,name&order=name');barber.innerHTML=barbers.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}async function generar(){let id=barber.value,f=from.value,t=to.value;let fl=(f?'&business_date=gte.'+f:'')+(t?'&business_date=lte.'+t:'');let cuts=await api('cuts?select=*&barber_id=eq.'+id+fl),products=await api('products?select=*&barber_id=eq.'+id+fl);let all=[...cuts,...products],ct=cuts.reduce((a,x)=>a+Number(x.price||0),0),pt=products.reduce((a,x)=>a+Number(x.price||0),0);let cash=all.filter(x=>x.payment_method==='cash').reduce((a,x)=>a+Number(x.price||0),0),card=all.filter(x=>['debit','card'].includes(x.payment_method)).reduce((a,x)=>a+Number(x.price||0),0),trans=all.filter(x=>x.payment_method==='transfer').reduce((a,x)=>a+Number(x.price||0),0);let com=ct*.5+products.filter(x=>x.price>=7000).reduce((a,x)=>a+x.price*.1,0);let name=barbers.find(x=>x.id==id)?.name;resultado.innerHTML=`<div class="card"><h2>${name}</h2><div class="kpis"><div class="box">✂️ Cortes<div class="num">${cuts.length}</div></div><div class="box">💰 Total<div class="num">${money(ct+pt)}</div></div><div class="box">🥤 Productos<div class="num">${money(pt)}</div></div><div class="box">💸 Comisión<div class="num">${money(com)}</div></div></div><h3>Medios de pago</h3><div class="row">💵 Efectivo <b>${money(cash)}</b></div><div class="row">💳 Tarjeta <b>${money(card)}</b></div><div class="row">📲 Transferencia <b>${money(trans)}</b></div><h3>Detalle diario</h3>${all.map(x=>`<div class="row">${x.business_date||''} ${x.payment_method||''}<b>${money(x.price)}</b></div>`).join('')}</div>`}init();</script></body></html>
